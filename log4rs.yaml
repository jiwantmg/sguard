# log4rs.yaml
appenders:
  stdout:
    kind: console
    encoder:
      pattern: "{d} - {l} - {m}\n"

  file:
    kind: file
    path: "log/output.log"
    encoder:
      pattern: "{d} - {l} - {m}\n"

root:
  level: warn
  appenders:
    - stdout
    - file

loggers:
  my_crate:
    level: warn
    appenders:
      - stdout
      # - file
    additive: false
